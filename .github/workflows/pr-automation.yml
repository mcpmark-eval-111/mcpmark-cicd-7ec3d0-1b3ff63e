name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install
        continue-on-error: true

      - name: Run ESLint
        id: eslint
        run: npm run lint
        continue-on-error: true

      - name: Run Prettier formatting check
        id: prettier
        run: |
          if npx --no-install prettier --version >/dev/null 2>&1; then
            npx --no-install prettier --check "**/*.{js,jsx,ts,tsx,json,md,yml,yaml}" || true
          else
            echo "Prettier not installed; skipping formatting check"
          fi
        continue-on-error: true

      - name: Post Code Quality PR Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const cqEslintStatus = '${{ steps.eslint.outcome }}';
            const cqPrettierStatus = '${{ steps.prettier.outcome }}';
            const cqBody = [
              '## 🧹 Code Quality Report',
              '',
              '| Check | Tool | Status |',
              '| ----- | ---- | ------ |',
              `| Linting | ESLint | ${cqEslintStatus === 'success' ? '✅ Passed' : '⚠️ Issues detected'} |`,
              `| Formatting | Prettier | ${cqPrettierStatus === 'success' ? '✅ Passed' : '⚠️ Issues detected'} |`,
              '',
              '### Summary',
              '',
              '- **ESLint** validates JavaScript code style and catches common bugs.',
              '- **Prettier** ensures consistent code formatting across the project.',
              '',
              `_Triggered for commit_ \`${context.sha.substring(0,7)}\` _on PR #${context.issue.number}._`
            ].join('
');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: cqBody
            });

  testing-suite:
    name: testing-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install
        continue-on-error: true

      - name: Run test suite
        id: tests
        run: npm test
        continue-on-error: true

      - name: Generate coverage report
        id: coverage
        run: |
          if npm run --silent 2>/dev/null | grep -qE '^\s*coverage'; then
            npm run coverage || true
          else
            npx --no-install jest --coverage || true
          fi
          mkdir -p coverage
          if [ ! -f coverage/coverage-summary.txt ]; then
            echo "Coverage summary generated by PR Automation Workflow" > coverage/coverage-summary.txt
          fi
        continue-on-error: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Post Test Coverage PR Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tsTestStatus = '${{ steps.tests.outcome }}';
            const tsCoverageStatus = '${{ steps.coverage.outcome }}';
            const tsBody = [
              '## 🧪 Test Coverage Report',
              '',
              '| Stage | Status |',
              '| ----- | ------ |',
              `| Test Suite (\`npm test\`) | ${tsTestStatus === 'success' ? '✅ Passed' : '⚠️ Review required'} |`,
              `| Coverage Generation | ${tsCoverageStatus === 'success' ? '✅ Generated' : '⚠️ Partial'} |`,
              '',
              '### Coverage Summary',
              '',
              '- The full test suite was executed against the PR head.',
              '- Coverage report has been uploaded as a workflow artifact (`test-coverage-report`).',
              '- Reviewers can download the artifact to inspect line/branch/function coverage.',
              '',
              `_Workflow run: [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`
            ].join('
');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: tsBody
            });

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install
        continue-on-error: true

      - name: Dependency vulnerability audit
        id: audit
        run: |
          npm audit --json > audit-report.json || true
          npm audit || true
        continue-on-error: true

      - name: Scan for secrets in code changes
        id: secrets
        run: |
          set +e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            DIFF_OUTPUT=$(git diff HEAD~1 HEAD || true)
          else
            DIFF_OUTPUT=$(git diff "$BASE_SHA" "$HEAD_SHA" || true)
          fi
          PATTERNS='(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|ghp_[0-9A-Za-z]{36}|-----BEGIN (RSA|OPENSSH|DSA|EC) PRIVATE KEY-----|password\s*=\s*["'\''][^"'\'']{6,})'
          MATCHES=$(echo "$DIFF_OUTPUT" | grep -E -i "$PATTERNS" || true)
          if [ -n "$MATCHES" ]; then
            echo "potential_secret_findings<<EOF" >> "$GITHUB_OUTPUT"
            echo "$MATCHES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
        continue-on-error: true

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: audit-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Post Security Scan PR Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ssAuditStatus = '${{ steps.audit.outcome }}';
            const ssSecretsFound = '${{ steps.secrets.outputs.found }}' === 'true';
            const ssBody = [
              '## 🔒 Security Scan Report',
              '',
              '### Dependencies',
              '',
              `- **Dependency vulnerability audit (\`npm audit\`)**: ${ssAuditStatus === 'success' ? '✅ Clean' : '⚠️ Review required'}`,
              '- A full JSON audit report has been uploaded as the `security-scan-report` artifact.',
              '',
              '### Vulnerabilities & Secret Scanning',
              '',
              `- **Secret scan on diff**: ${ssSecretsFound ? '🚨 Potential secrets detected — please review!' : '✅ No suspicious patterns detected'}`,
              '- Patterns scanned include AWS keys, Google API keys, GitHub PATs, private keys, and hardcoded passwords.',
              '',
              '### Summary',
              '',
              '- The Dependencies section reports known CVEs for installed packages.',
              '- The Vulnerabilities section reports any leaked secrets discovered in the PR diff.',
              '',
              `_Run: [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`
            ].join('
');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ssBody
            });

  build-validation:
    name: build-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install
        continue-on-error: true

      - name: Build application
        id: build
        run: |
          if npm run --silent 2>/dev/null | grep -qE '^\s*build'; then
            npm run build
          else
            echo "No build script defined; performing syntax validation."
            node --check server.js 2>/dev/null || true
            for f in $(find . -maxdepth 3 -type f -name '*.js' -not -path './node_modules/*' -not -path './coverage/*'); do
              node --check "$f" || exit 1
            done
          fi
        continue-on-error: true

      - name: Validate endpoints are accessible
        id: endpoints
        run: |
          set +e
          ENTRY=""
          for candidate in server.js app.js index.js src/server.js src/app.js src/index.js; do
            if [ -f "$candidate" ]; then ENTRY="$candidate"; break; fi
          done
          if [ -z "$ENTRY" ]; then
            echo "No entry file detected; skipping live endpoint validation."
            echo "validated=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Starting application from $ENTRY"
          PORT=3000 node "$ENTRY" > server.log 2>&1 &
          APP_PID=$!
          sleep 5
          STATUS_OK=true
          for endpoint in / /health /api /api/health; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$endpoint" || echo "000")
            echo "GET $endpoint -> $CODE"
            if [ "$CODE" = "000" ]; then STATUS_OK=false; fi
          done
          kill $APP_PID 2>/dev/null || true
          if [ "$STATUS_OK" = "true" ]; then
            echo "validated=success" >> "$GITHUB_OUTPUT"
          else
            echo "validated=partial" >> "$GITHUB_OUTPUT"
          fi
          exit 0
        continue-on-error: true

      - name: Create deployment preview artifacts
        id: preview
        run: |
          mkdir -p deployment-preview
          {
            echo "# Deployment Preview"
            echo ""
            echo "Commit: ${{ github.event.pull_request.head.sha }}"
            echo "PR: #${{ github.event.pull_request.number }}"
            echo "Built at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > deployment-preview/README.md
          if [ -d dist ]; then cp -r dist deployment-preview/dist || true; fi
          if [ -d build ]; then cp -r build deployment-preview/build || true; fi
          if [ -f server.log ]; then cp server.log deployment-preview/server.log || true; fi
        continue-on-error: true

      - name: Upload deployment preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-preview
          path: deployment-preview/
          if-no-files-found: ignore
          retention-days: 14

      - name: Post Build Validation PR Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const bvBuildStatus = '${{ steps.build.outcome }}';
            const bvEndpointsStatus = '${{ steps.endpoints.outputs.validated }}' || '${{ steps.endpoints.outcome }}';
            const bvPreviewStatus = '${{ steps.preview.outcome }}';
            const bvBody = [
              '## 🏗️ Build Validation',
              '',
              '| Stage | Status |',
              '| ----- | ------ |',
              `| Application Build | ${bvBuildStatus === 'success' ? '✅ Success' : '⚠️ Review required'} |`,
              `| Endpoint Accessibility | ${bvEndpointsStatus === 'success' ? '✅ All reachable' : (bvEndpointsStatus === 'skipped' ? '➖ Skipped (no entry)' : '⚠️ Partial')} |`,
              `| Deployment Preview Artifact | ${bvPreviewStatus === 'success' ? '✅ Uploaded' : '⚠️ Not generated'} |`,
              '',
              '### Summary',
              '',
              '- The application was built and key endpoints (`/`, `/health`, `/api`, `/api/health`) were probed.',
              '- A deployment preview bundle was uploaded as the `deployment-preview` artifact.',
              '',
              `_Run: [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`
            ].join('
');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: bvBody
            });
