name: PR Automation Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ESLint
        id: eslint
        continue-on-error: true
        run: |
          set +e
          npm run lint > eslint-report.txt 2>&1
          echo "eslint_exit=$?" >> "$GITHUB_OUTPUT"
          cat eslint-report.txt

      - name: Run Prettier formatting check
        id: prettier
        continue-on-error: true
        run: |
          set +e
          if npm run | grep -qE "^  format(:check)?$"; then
            npm run format:check > prettier-report.txt 2>&1 || npm run format -- --check > prettier-report.txt 2>&1
          else
            npx --yes prettier --check "**/*.{js,jsx,ts,tsx,json,md,yml,yaml}" > prettier-report.txt 2>&1
          fi
          echo "prettier_exit=$?" >> "$GITHUB_OUTPUT"
          cat prettier-report.txt || true

      - name: Post Code Quality Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const eslintExit = '${{ steps.eslint.outputs.eslint_exit }}' || 'unknown';
            const prettierExit = '${{ steps.prettier.outputs.prettier_exit }}' || 'unknown';
            const eslintStatus = eslintExit === '0' ? '✅ Passed' : '⚠️ Issues detected';
            const prettierStatus = prettierExit === '0' ? '✅ Passed' : '⚠️ Issues detected';

            let eslintOutput = '';
            try { eslintOutput = fs.readFileSync('eslint-report.txt', 'utf8').slice(0, 2000); } catch (e) { eslintOutput = 'No ESLint output captured.'; }
            let prettierOutput = '';
            try { prettierOutput = fs.readFileSync('prettier-report.txt', 'utf8').slice(0, 2000); } catch (e) { prettierOutput = 'No Prettier output captured.'; }

            const body = [
              '## 🧹 Code Quality Report',
              '',
              '| Check | Status |',
              '| --- | --- |',
              `| ESLint | ${eslintStatus} |`,
              `| Prettier | ${prettierStatus} |`,
              '',
              '<details><summary>ESLint output</summary>',
              '',
              '```',
              eslintOutput,
              '```',
              '',
              '</details>',
              '',
              '<details><summary>Prettier output</summary>',
              '',
              '```',
              prettierOutput,
              '```',
              '',
              '</details>',
              '',
              '_Posted by code-quality job._'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  testing-suite:
    name: testing-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          set +e
          npm test -- --coverage > test-output.txt 2>&1
          test_exit=$?
          echo "test_exit=$test_exit" >> "$GITHUB_OUTPUT"
          cat test-output.txt || true

      - name: Generate coverage summary
        id: coverage
        if: always()
        continue-on-error: true
        run: |
          set +e
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const c=require('./coverage/coverage-summary.json').total;console.log(JSON.stringify(c,null,2))" > coverage-summary.txt 2>&1
          elif [ -f coverage/lcov.info ]; then
            head -200 coverage/lcov.info > coverage-summary.txt
          else
            echo "Coverage report not found." > coverage-summary.txt
          fi
          cat coverage-summary.txt || true

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            test-output.txt
            coverage-summary.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Post Test Coverage Report comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testExit = '${{ steps.tests.outputs.test_exit }}' || 'unknown';
            const status = testExit === '0' ? '✅ All tests passed' : '⚠️ Some tests failed';

            let coverageSummary = '';
            try { coverageSummary = fs.readFileSync('coverage-summary.txt', 'utf8').slice(0, 3000); } catch (e) { coverageSummary = 'Coverage summary not available.'; }
            let testOutput = '';
            try { testOutput = fs.readFileSync('test-output.txt', 'utf8').slice(-2000); } catch (e) { testOutput = 'Test output not captured.'; }

            const body = [
              '## 🧪 Test Coverage Report',
              '',
              `**Status:** ${status}`,
              '',
              '### Coverage Summary',
              '',
              '```json',
              coverageSummary,
              '```',
              '',
              '<details><summary>Test runner output (tail)</summary>',
              '',
              '```',
              testOutput,
              '```',
              '',
              '</details>',
              '',
              '_Posted by testing-suite job._'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run npm audit (dependency vulnerability check)
        id: audit
        continue-on-error: true
        run: |
          set +e
          npm audit --audit-level=low --json > audit-report.json 2>&1
          audit_exit=$?
          echo "audit_exit=$audit_exit" >> "$GITHUB_OUTPUT"
          npm audit --audit-level=low > audit-report.txt 2>&1 || true
          cat audit-report.txt || true

      - name: Scan for secrets in code changes
        id: secrets
        continue-on-error: true
        run: |
          set +e
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          echo "Diffing $base_sha..$head_sha"
          git fetch origin "$base_sha" || true
          git diff "$base_sha" "$head_sha" > pr-diff.patch 2>/dev/null || git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > pr-diff.patch 2>/dev/null || true

          patterns=(
            'AKIA[0-9A-Z]{16}'
            'AIza[0-9A-Za-z_\-]{35}'
            'ghp_[0-9A-Za-z]{36,}'
            'gho_[0-9A-Za-z]{36,}'
            'xox[abp]-[0-9A-Za-z\-]+'
            '-----BEGIN (RSA|DSA|EC|OPENSSH|PRIVATE) KEY-----'
            '(api[_-]?key|secret|token|password)["'"'"' ]*[:=]["'"'"' ]*[A-Za-z0-9_\-]{16,}'
          )
          : > secrets-report.txt
          found=0
          for pattern in "${patterns[@]}"; do
            if grep -E -nH "$pattern" pr-diff.patch >> secrets-report.txt 2>/dev/null; then
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No secrets detected in code changes." > secrets-report.txt
          fi
          echo "secrets_found=$found" >> "$GITHUB_OUTPUT"
          cat secrets-report.txt

      - name: Post Security Scan Report comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const auditExit = '${{ steps.audit.outputs.audit_exit }}' || 'unknown';
            const secretsFound = '${{ steps.secrets.outputs.secrets_found }}' || '0';

            const depStatus = auditExit === '0' ? '✅ No known vulnerabilities' : '⚠️ Vulnerabilities detected';
            const secretsStatus = secretsFound === '0' ? '✅ No secrets detected' : '🚨 Potential secrets found';

            let auditReport = '';
            try { auditReport = fs.readFileSync('audit-report.txt', 'utf8').slice(0, 3000); } catch (e) { auditReport = 'No audit output.'; }
            let secretsReport = '';
            try { secretsReport = fs.readFileSync('secrets-report.txt', 'utf8').slice(0, 2000); } catch (e) { secretsReport = 'No secrets report.'; }

            const body = [
              '## 🔐 Security Scan Report',
              '',
              '| Check | Status |',
              '| --- | --- |',
              `| Dependencies (Vulnerabilities) | ${depStatus} |`,
              `| Secret scanning | ${secretsStatus} |`,
              '',
              '### Dependencies / Vulnerabilities',
              '',
              '<details><summary>npm audit output</summary>',
              '',
              '```',
              auditReport,
              '```',
              '',
              '</details>',
              '',
              '### Secret Scan (PR diff)',
              '',
              '```',
              secretsReport,
              '```',
              '',
              '_Posted by security-scan job._'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  build-validation:
    name: build-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build application
        id: build
        continue-on-error: true
        run: |
          set +e
          if npm run | grep -qE "^  build$"; then
            npm run build > build-output.txt 2>&1
          else
            echo "No build script defined; performing syntax validation." > build-output.txt
            node --check server.js >> build-output.txt 2>&1 || true
            find . -path ./node_modules -prune -o -name "*.js" -print | head -50 | while read f; do
              node --check "$f" >> build-output.txt 2>&1 || echo "Syntax issue in $f" >> build-output.txt
            done
          fi
          build_exit=$?
          echo "build_exit=$build_exit" >> "$GITHUB_OUTPUT"
          cat build-output.txt || true

      - name: Validate endpoints are accessible
        id: endpoints
        continue-on-error: true
        run: |
          set +e
          : > endpoints-report.txt
          # Start the application in the background
          (npm start > app.log 2>&1 &) || true
          APP_PID=$!
          echo "Started app (best-effort), waiting for it to come up..." >> endpoints-report.txt

          PORT="${PORT:-3000}"
          ready=0
          for i in $(seq 1 20); do
            if curl -sSf "http://localhost:${PORT}/" -o /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Application did not respond on port ${PORT}; falling back to static endpoint discovery." >> endpoints-report.txt
          fi

          # Discover endpoint declarations in source for reporting
          echo "" >> endpoints-report.txt
          echo "Declared endpoints (from source):" >> endpoints-report.txt
          grep -RInE "app\.(get|post|put|delete|patch)\(['\"]([^'\"]+)['\"]" --include="*.js" . 2>/dev/null \
            | grep -v node_modules >> endpoints-report.txt || echo "No endpoint declarations found." >> endpoints-report.txt

          # Try common endpoints
          echo "" >> endpoints-report.txt
          echo "Endpoint accessibility checks:" >> endpoints-report.txt
          for ep in "/" "/health" "/api" "/api/health" "/api/status"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${PORT}${ep}" || echo "000")
            echo "  ${ep} -> HTTP ${code}" >> endpoints-report.txt
          done

          # Stop app
          pkill -f "node" 2>/dev/null || true
          cat endpoints-report.txt

      - name: Create deployment preview artifact
        if: always()
        run: |
          mkdir -p deployment-preview
          cp -r build-output.txt endpoints-report.txt deployment-preview/ 2>/dev/null || true
          cat > deployment-preview/preview.md << 'EOF'
          # Deployment Preview

          This artifact contains the build output and endpoint validation report
          generated for this Pull Request.
          EOF

      - name: Upload deployment preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-preview
          path: deployment-preview/
          if-no-files-found: ignore
          retention-days: 7

      - name: Post Build Validation comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const buildExit = '${{ steps.build.outputs.build_exit }}' || 'unknown';
            const buildStatus = buildExit === '0' ? '✅ Build succeeded' : '⚠️ Build issues detected';

            let buildOutput = '';
            try { buildOutput = fs.readFileSync('build-output.txt', 'utf8').slice(0, 3000); } catch (e) { buildOutput = 'No build output.'; }
            let endpointsOutput = '';
            try { endpointsOutput = fs.readFileSync('endpoints-report.txt', 'utf8').slice(0, 3000); } catch (e) { endpointsOutput = 'No endpoint report.'; }

            const body = [
              '## 🏗️ Build Validation',
              '',
              `**Status:** ${buildStatus}`,
              '',
              '### Build Output',
              '',
              '<details><summary>Build log</summary>',
              '',
              '```',
              buildOutput,
              '```',
              '',
              '</details>',
              '',
              '### Endpoint Accessibility',
              '',
              '```',
              endpointsOutput,
              '```',
              '',
              'A `deployment-preview` artifact has been uploaded for this PR.',
              '',
              '_Posted by build-validation job._'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
